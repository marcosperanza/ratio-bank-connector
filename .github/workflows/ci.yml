name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Lint + compile (all branches, PRs, tags) ───────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test ./...
      - run: go vet ./...

  build-check:
    name: Build check (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build ./...

  # ── Release binaries + Docker image (tags only) ────────────────────────────
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: [lint, test, build-check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
            archive_ext: zip
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.suffix }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/package
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.buildDate=${BUILD_DATE}" \
            -o dist/package/bank-connector${{ matrix.ext }} \
            ./cmd/connector

      - name: Package ${{ matrix.suffix }}
        run: |
          cp README.md LICENSE LICENSING.md THIRD_PARTY_NOTICES.md config.yaml.example dist/package/
          cp -R docs THIRD_PARTY_LICENSES .third_party-source scripts dist/package/
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd dist/package && zip -qr ../bank-connector-${{ matrix.suffix }}.zip .)
          else
            tar -C dist/package -czf dist/bank-connector-${{ matrix.suffix }}.tar.gz .
          fi
          cd dist
          sha256sum bank-connector-${{ matrix.suffix }}.${{ matrix.archive_ext }} > bank-connector-${{ matrix.suffix }}.${{ matrix.archive_ext }}.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bank-connector-${{ matrix.suffix }}.${{ matrix.archive_ext }}
            dist/bank-connector-${{ matrix.suffix }}.${{ matrix.archive_ext }}.sha256

  release-docker:
    name: Release Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, build-check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  release-source:
    name: Release corresponding source
    runs-on: ubuntu-latest
    needs: [release-binaries, release-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package source for this tag
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=ratio-bank-connector-${GITHUB_REF_NAME}/ "${GITHUB_REF_NAME}" -o dist/ratio-bank-connector-${GITHUB_REF_NAME}-source.tar.gz
          cd dist
          sha256sum ratio-bank-connector-${GITHUB_REF_NAME}-source.tar.gz > ratio-bank-connector-${GITHUB_REF_NAME}-source.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ratio-bank-connector-${{ github.ref_name }}-source.tar.gz
            dist/ratio-bank-connector-${{ github.ref_name }}-source.tar.gz.sha256
          fail_on_unmatched_files: true
