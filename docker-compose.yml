# Always-on install for a NAS or Raspberry Pi.
#
#   1. docker compose run --rm setup      builds the image on first use, then guided setup (writes ./config/config.yaml)
#   2. docker compose up -d --build       starts the connector service
#
# Optional settings page (same checks as the setup, in a browser):
#   docker compose --profile ui up ui     then open the printed link on this machine
#
# Connect or renew an Enable Banking bank from the terminal (no browser on the server):
#   docker compose run --rm cli link            authorize a bank, paste the code
#   docker compose run --rm cli sessions        banks connected and days left
#   docker compose run --rm cli sessions --renew
#
# Bank accounts that read a CSV folder expect the files under ./data/imports/<name>.
services:
  bank-connector:
    build:
      context: .
      dockerfile: Dockerfile
    image: ratio-bank-connector:local
    # With a mounted config file (this compose file) the connector reads it and keeps its state in ./data.
    # Without one, the image runs from environment variables alone: docs/DEPLOY_CONTAINER.md.
    command: ["sync", "--daemon", "--config", "/app/config/config.yaml"]
    healthcheck:
      test: ["CMD", "./bank-connector", "doctor", "--config", "/app/config/config.yaml"]
      interval: 5m
      timeout: 30s
      start_period: 30s
      retries: 2
    environment:
      BANK_CONNECTOR_DATA_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Guided terminal setup. The only service that can write the configuration.
  setup:
    image: ratio-bank-connector:local
    build: .
    profiles: ["setup"]
    command: ["setup", "--config", "/app/config/config.yaml"]
    environment:
      BANK_CONNECTOR_DATA_DIR: /app/data
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Settings page, published on this machine only. Needs the token in the link.
  ui:
    image: ratio-bank-connector:local
    build: .
    profiles: ["ui"]
    command: ["ui", "--listen", "0.0.0.0:8787", "--no-open", "--config", "/app/config/config.yaml"]
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      disable: true
    environment:
      BANK_CONNECTOR_DATA_DIR: /app/data
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-off commands: link a bank, list or renew the consents. The configuration
  # stays read-only; only the data volume (the sessions) is written.
  cli:
    image: ratio-bank-connector:local
    build: .
    profiles: ["cli"]
    command: ["sessions"]
    environment:
      BANK_CONNECTOR_DATA_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
