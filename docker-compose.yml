services:
  bank-connector:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/marcosperanza/ratio-bank-connector:latest
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
