<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratio Connector</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e7;
    --accent: #1d6b4f; --accent-text: #fff; --ok: #1d7a46; --warn: #b26b00; --bad: #b42318; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --card: #1d2125; --text: #e8ebef; --muted: #9aa4b1; --line: #2d333a;
      --accent: #3fae83; --accent-text: #0b1a13; --ok: #4cc27e; --warn: #e3a13a; --bad: #f2776d; --field: #14171a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 96px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 18px 0 6px; }
  #meta { white-space: pre-line; }
  p.hint, .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--text); font: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: var(--ok); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.warn { color: var(--warn); border-color: var(--warn); }
  .result { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
  .result.ok { color: var(--ok); } .result.bad { color: var(--bad); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .check input { width: auto; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; }
  .bar div { max-width: 820px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
  .problems { color: var(--warn); font-size: 13px; }
  .grow { flex: 1; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Ratio Connector</h1>
      <p class="hint" id="meta"></p>
    </div>
    <div id="statusPills"></div>
  </div>

  <section id="serviceBox">
    <h2 data-i18n="svcTitle"></h2>
    <p class="hint" id="svcText"></p>
    <div class="actions" id="svcActions"></div>
    <div class="result" id="svcResult"></div>
  </section>

  <section>
    <h2>Ratio</h2>
    <div class="row">
      <div><label data-i18n="ratioUrl"></label><input type="text" id="ratioUrl"></div>
      <div><label data-i18n="ratioKey"></label><input type="password" id="ratioKey" autocomplete="off"></div>
    </div>
    <p class="hint" data-i18n="ratioHint"></p>
    <div class="actions"><button id="testRatio" data-i18n="test"></button></div>
    <div class="result" id="ratioResult"></div>
  </section>

  <section>
    <h2 data-i18n="banksTitle"></h2>
    <p class="hint" data-i18n="banksHint"></p>

    <div class="item">
      <div class="check"><input type="checkbox" id="ebOn"><strong>Enable Banking</strong></div>
      <div id="ebBox">
        <div class="row">
          <div><label data-i18n="ebAppId"></label><input type="text" id="ebAppId"></div>
          <div><label data-i18n="ebPem"></label><input type="text" id="ebPem"></div>
        </div>
        <label data-i18n="ebRedirectLabel"></label>
        <input type="text" id="ebRedirect" placeholder="https://enablebanking.com/">
        <p class="hint" data-i18n="ebRedirectHint"></p>
        <div class="actions"><button id="ebLocalUrl" data-i18n="ebUseLocal"></button><button id="testEb" data-i18n="test"></button></div>
        <details><summary data-i18n="ebCert"></summary>
          <div class="row">
            <div><label data-i18n="ebCertFile"></label><input type="text" id="ebCert"></div>
            <div><label data-i18n="ebKeyFile"></label><input type="text" id="ebKey"></div>
          </div>
          <p class="hint" data-i18n="ebCertHint"></p>
        </details>
        <div class="result" id="ebResult"></div>

        <h3 data-i18n="ebBanks"></h3>
        <div id="ebSessions"></div>
        <div class="actions"><button class="primary" id="ebConnect" data-i18n="ebConnect"></button></div>
        <div id="ebFlow" class="item" style="display:none"></div>
      </div>
    </div>

    <div class="item">
      <strong data-i18n="otherSources"></strong>
      <p class="hint" id="otherSources"></p>
    </div>
  </section>

  <section>
    <h2 data-i18n="schedTitle"></h2>
    <div class="row">
      <div><label data-i18n="schedInterval"></label><input type="number" min="1" id="syncHours"></div>
      <div><label data-i18n="schedLookback"></label><input type="number" min="1" id="lookback"></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="pricesTitle"></h2>
    <div class="check"><input type="checkbox" id="pricesOn"><span data-i18n="pricesOn"></span></div>
    <div id="pricesBox">
      <p class="hint" data-i18n="pricesHint"></p>
      <div id="providers"></div>
      <div class="row">
        <div><label data-i18n="pricesFile"></label><input type="text" id="tickersFile"></div>
        <div><label data-i18n="pricesInterval"></label><input type="number" min="1" id="pricesHours"></div>
      </div>
      <p class="hint" data-i18n="pricesFingerprint"></p>
      <div class="actions">
        <button type="button" id="fpShow" data-i18n="fpShow"></button>
        <button type="button" id="fpCopy" data-i18n="fpCopy" style="display:none"></button>
        <button type="button" id="pricesRefresh" data-i18n="pricesRefresh"></button>
      </div>
      <div class="result" id="refreshResult"></div>
      <p><code id="fpValue" style="font-size:15px;letter-spacing:.04em;word-break:break-all"></code></p>
      <div class="result" id="fpResult"></div>
    </div>
  </section>
</main>

<div class="bar"><div>
  <span class="problems grow" id="problems"></span>
  <span class="result" id="saveResult"></span>
  <button class="primary" id="save" data-i18n="save"></button>
</div></div>

<script>
const params = new URLSearchParams(location.hash.slice(1));
const TOKEN = params.get("t") || sessionStorage.getItem("t") || "";
if (params.get("t")) { try { sessionStorage.setItem("t", TOKEN); } catch (e) {} history.replaceState(null, "", location.pathname); }

const I18N = {
  en: {
    svcTitle: "Background service", test: "Test", remove: "Remove", save: "Save",
    ratioUrl: "Ratio address", ratioKey: "API key", ratioHint: "Create the key in Ratio under Connector. It is stored only on this computer.",
    banksTitle: "Bank sources", banksHint: "Use one or several at the same time. Each bank account in Ratio picks the source it reads from.",
    ebAppId: "Application id", ebPem: "Path to the PEM private key",
    ebRedirectLabel: "Redirect URL", ebUseLocal: "Use https://enablebanking.com/ (simplest)",
    ebRedirectHint: "Register https://enablebanking.com/ as a redirect URL in your Enable Banking application: no server or certificate needed. After the bank login you land on that page and paste the code from the address bar here. You can also use your own URL, or https://localhost:PORT/... to let the connector receive the answer by itself.",
    ebCert: "Certificate for the local callback (optional)", ebCertFile: "Certificate file (PEM)", ebKeyFile: "Key file (PEM)",
    ebCertHint: "Without a certificate the connector makes a temporary one and the browser asks you to continue once. A certificate from mkcert avoids that.",
    ebBanks: "Connected banks", ebNone: "No bank connected yet.", ebConnect: "Connect a bank", ebRenew: "Renew", ebForget: "Forget",
    ebCountry: "Country", ebBank: "Bank", ebAuthorize: "Authorize with the bank", ebCancel: "Cancel", ebLoading: "Loading banks…",
    ebOpened: "The bank page opened in a new tab. If it did not, ", ebOpenLink: "open it here",
    ebWaitAuto: "Waiting for you to finish at the bank. If the browser warns about the certificate, continue: it is your own computer.",
    ebWaitPaste: "When the bank is done it sends you to your redirect URL. Copy the code (or the whole address) from the browser bar and paste it here.",
    ebPaste: "Pasted address", ebFinish: "Finish", ebDone: "Connected", ebUntil: "valid until", ebDays: "days left", ebExpired: "expired", ebExpiring: "expires soon",
    ebNameHint: "In Ratio create the account with provider enablebanking-local and name it after the IBAN (or the bank, if it has a single account).",
    ebNeedSetup: "Fill in the application id, the key and the redirect URL first.",
    otherSources: "Other sources", otherSourcesHint: "SimpleFIN accounts: {s}. Folders: {f}. They are set in the configuration file (see docs/PROVIDERS.md).",
    schedTitle: "Schedule", schedInterval: "Check each account every (hours)", schedLookback: "First sync reaches back (days)",
    pricesTitle: "Prices", pricesOn: "Download prices for the tickers you hold",
    pricesHint: "Providers are tried in order; when one runs out of quota the next one is used. Keys stay on this computer.",
    pricesFile: "Extra tickers file (optional)", pricesInterval: "Download every (hours)",
    pricesFingerprint: "Tickers come from your open positions in Ratio. Show the fingerprint of this connector’s key below, then compare it with the one Ratio shows in Investments and approve it there.",
    fpShow: "Show fingerprint and register the key", fpCopy: "Copy",
    pricesRefresh: "Refresh prices now", refreshBusy: "A download is already running.", refreshDone: "Prices downloaded: {n} tickers, {f} without data.", refreshNone: "No tickers to download yet: open Investments in Ratio and approve this key.",
    fpCreated: "A new key was generated on this computer.", fpRegistered: "The key is registered with Ratio: open Investments in Ratio, compare this fingerprint and approve it.",
    fpNoKey: "Not registered with Ratio: save your Ratio API key first, then press the button again.", fpRegisterFailed: "Could not register the key with Ratio",
    install: "Install and start", restart: "Restart to apply", uninstall: "Remove service",
    svcRunning: "The connector is running in the background.", svcStopped: "The service is installed but not running.", svcNone: "Not installed as a service: it only runs when you start it.",
    svcDocker: "Running in Docker: the container is the service. After saving, run docker compose restart.",
    alive: "Running", notAlive: "Not running", saved: "Saved", saveFirst: "Save your changes first.",
    advanced: "Columns and format", delimiter: "Delimiter", dateCol: "Date column", amountCol: "Amount column", debitCol: "Debit column", creditCol: "Credit column",
    descCol: "Description column", dateFmt: "Date format (e.g. 02/01/2006)", dec: "Decimal separator", cur: "Default currency", enable: "Use", key: "API key", dailyLimit: "Daily limit", gap: "Seconds between calls",
    keySaved: "saved — leave empty to keep", set: "connected", notSet: "not connected", lastBank: "Last bank sync", lastPrices: "Last price run", never: "never",
    redirect: "Add this redirect URL to your Enable Banking application: ", working: "Working…", saveBlocked: "Not saved: fix the points below.",
    prov_yahoo: "Yahoo (no key, unofficial)", prov_twelvedata: "Twelve Data (free key, ~780 calls/day)", prov_alphavantage: "Alpha Vantage (free key, 25 calls/day)"
  },
  it: {
    svcTitle: "Servizio in background", test: "Prova", remove: "Rimuovi", save: "Salva",
    ratioUrl: "Indirizzo di Ratio", ratioKey: "Chiave API", ratioHint: "Crea la chiave in Ratio, sezione Connector. Resta solo su questo computer.",
    banksTitle: "Fonti bancarie", banksHint: "Puoi usarne una o più insieme. Ogni conto in Ratio sceglie da quale fonte leggere.",
    ebAppId: "ID applicazione", ebPem: "Percorso della chiave privata PEM",
    ebRedirectLabel: "Redirect URL", ebUseLocal: "Usa https://enablebanking.com/ (il più semplice)",
    ebRedirectHint: "Registra https://enablebanking.com/ come redirect URL nella tua applicazione Enable Banking: non servono server né certificati. Dopo il login alla banca arrivi su quella pagina e incolli qui il code dalla barra degli indirizzi. Puoi usare anche un tuo URL, o https://localhost:PORTA/... per far ricevere la risposta al connector.",
    ebCert: "Certificato per la callback locale (facoltativo)", ebCertFile: "File del certificato (PEM)", ebKeyFile: "File della chiave (PEM)",
    ebCertHint: "Senza certificato il connector ne crea uno temporaneo e il browser ti chiede di continuare una volta. Un certificato di mkcert evita l’avviso.",
    ebBanks: "Banche collegate", ebNone: "Nessuna banca collegata.", ebConnect: "Collega una banca", ebRenew: "Rinnova", ebForget: "Dimentica",
    ebCountry: "Paese", ebBank: "Banca", ebAuthorize: "Autorizza dalla banca", ebCancel: "Annulla", ebLoading: "Carico le banche…",
    ebOpened: "La pagina della banca si è aperta in una nuova scheda. Se non è successo, ", ebOpenLink: "aprila da qui",
    ebWaitAuto: "Attendo che tu finisca dalla banca. Se il browser avvisa per il certificato, continua: è il tuo computer.",
    ebWaitPaste: "Quando la banca ha finito ti manda al tuo redirect URL. Copia il code (o l’intero indirizzo) dalla barra del browser e incollalo qui.",
    ebPaste: "Indirizzo incollato", ebFinish: "Concludi", ebDone: "Collegata", ebUntil: "valida fino al", ebDays: "giorni rimasti", ebExpired: "scaduta", ebExpiring: "sta per scadere",
    ebNameHint: "In Ratio crea il conto con provider enablebanking-local e chiamalo come l’IBAN (o come la banca, se ha un solo conto).",
    ebNeedSetup: "Compila prima ID applicazione, chiave e redirect URL.",
    otherSources: "Altre sorgenti", otherSourcesHint: "Conti SimpleFIN: {s}. Cartelle: {f}. Si impostano nel file di configurazione (vedi docs/PROVIDERS.md).",
    schedTitle: "Frequenza", schedInterval: "Controlla ogni conto ogni (ore)", schedLookback: "La prima sincronizzazione risale a (giorni)",
    pricesTitle: "Prezzi", pricesOn: "Scarica i prezzi dei titoli che possiedi",
    pricesHint: "I provider si provano in ordine; quando uno finisce la quota si passa al successivo. Le chiavi restano su questo computer.",
    pricesFile: "File di ticker extra (facoltativo)", pricesInterval: "Scarica ogni (ore)",
    pricesFingerprint: "I ticker arrivano dalle tue posizioni aperte in Ratio. Mostra qui sotto l’impronta della chiave di questo connector, confrontala con quella che Ratio mostra in Investimenti e approvala lì.",
    fpShow: "Mostra l’impronta e registra la chiave", fpCopy: "Copia",
    pricesRefresh: "Aggiorna i prezzi ora", refreshBusy: "Un download è già in corso.", refreshDone: "Prezzi scaricati: {n} ticker, {f} senza dati.", refreshNone: "Ancora nessun ticker da scaricare: apri Investimenti in Ratio e approva questa chiave.",
    fpCreated: "È stata generata una nuova chiave su questo computer.", fpRegistered: "La chiave è registrata in Ratio: apri Investimenti in Ratio, confronta questa impronta e approvala.",
    fpNoKey: "Non registrata in Ratio: salva prima la chiave API di Ratio, poi premi di nuovo il pulsante.", fpRegisterFailed: "Impossibile registrare la chiave in Ratio",
    install: "Installa e avvia", restart: "Riavvia per applicare", uninstall: "Rimuovi il servizio",
    svcRunning: "Il connector è in esecuzione in background.", svcStopped: "Il servizio è installato ma non in esecuzione.", svcNone: "Non installato come servizio: gira solo quando lo avvii.",
    svcDocker: "In Docker il container è il servizio. Dopo aver salvato esegui docker compose restart.",
    alive: "In esecuzione", notAlive: "Non in esecuzione", saved: "Salvato", saveFirst: "Salva prima le modifiche.",
    advanced: "Colonne e formato", delimiter: "Separatore", dateCol: "Colonna data", amountCol: "Colonna importo", debitCol: "Colonna addebiti", creditCol: "Colonna accrediti",
    descCol: "Colonna descrizione", dateFmt: "Formato data (es. 02/01/2006)", dec: "Separatore decimale", cur: "Valuta predefinita", enable: "Usa", key: "Chiave API", dailyLimit: "Limite giornaliero", gap: "Secondi tra le chiamate",
    keySaved: "salvata — lascia vuoto per mantenerla", set: "collegato", notSet: "non collegato", lastBank: "Ultima sync banche", lastPrices: "Ultimo scarico prezzi", never: "mai",
    redirect: "Aggiungi questo redirect URL alla tua applicazione Enable Banking: ", working: "In corso…", saveBlocked: "Non salvato: correggi i punti qui sotto.",
    prov_yahoo: "Yahoo (senza chiave, non ufficiale)", prov_twelvedata: "Twelve Data (chiave gratuita, ~780 chiamate/giorno)", prov_alphavantage: "Alpha Vantage (chiave gratuita, 25 chiamate/giorno)"
  }
};
const LANG = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
document.documentElement.lang = LANG;
const t = k => I18N[LANG][k] || I18N.en[k] || k;
document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));

const $ = id => document.getElementById(id);
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "X-Connector-Token": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await res.json(); } catch (e) {}
  return { status: res.status, data };
}
function show(el, r) { el.className = "result " + (r.ok ? "ok" : "bad"); el.textContent = (r.ok ? "✓ " : "✗ ") + r.message + ((r.items || []).length ? "\n" + r.items.join("\n") : ""); }
function busy(el) { el.className = "result"; el.textContent = t("working"); }
function el(tag, props, ...kids) { const e = document.createElement(tag); Object.assign(e, props || {}); kids.forEach(k => e.append(k)); return e; }
function field(label, input) { const wrap = el("div"); wrap.append(el("label", { textContent: label }), input); return wrap; }

let state = null, providers = [];
const PROVIDERS = ["yahoo", "twelvedata", "alphavantage"];
const DEFAULTS = { yahoo: { dailyLimit: 0, gapSeconds: 0 }, twelvedata: { dailyLimit: 780, gapSeconds: 8 }, alphavantage: { dailyLimit: 25, gapSeconds: 15 } };

function validDate(s) { return !!s && !s.startsWith("0001"); }
function fmtDate(s) { if (!s || s.startsWith("0001")) return t("never"); return new Date(s).toLocaleString(LANG); }

function renderHeader(s) {
  state = Object.assign(state || {}, { alive: s.alive, service: s.service, status: s.status });
  $("meta").textContent = "v" + s.version + " · " + s.configPath;
  const pills = $("statusPills"); pills.textContent = "";
  pills.append(el("span", { className: "pill " + (s.alive ? "ok" : "bad"), textContent: s.alive ? t("alive") : t("notAlive") }));
  const st = s.status || {};
  const lines = [];
  if (st.bank && validDate(st.bank.at)) lines.push(t("lastBank") + ": " + fmtDate(st.bank.at) + (st.bank.ok ? "" : " ✗ " + (st.bank.error || "")));
  if (st.prices && validDate(st.prices.at)) lines.push(t("lastPrices") + ": " + fmtDate(st.prices.at) + " (" + st.prices.tickers + ")" + (st.prices.ok ? "" : " ✗ " + (st.prices.error || "")));
  $("meta").textContent += lines.length ? "\n" + lines.join(" · ") : "";
  const sv = s.service || {};
  $("svcText").textContent = s.docker ? t("svcDocker") : sv.running ? t("svcRunning") : sv.installed ? t("svcStopped") : t("svcNone");
  const acts = $("svcActions"); acts.textContent = "";
  if (!s.docker) {
    acts.append(el("button", { className: sv.installed ? "" : "primary", textContent: sv.installed ? t("restart") : t("install"), onclick: () => svc(sv.installed ? "restart" : "install") }));
    if (sv.installed) acts.append(el("button", { className: "danger", textContent: t("uninstall"), onclick: () => svc("uninstall") }));
  }
}

function render(s) {
  state = s;
  const c = s.config;
  renderHeader(s);
  $("ratioUrl").value = c.ratio.url || "";
  $("ratioKey").value = ""; $("ratioKey").placeholder = c.ratio.apiKeySet ? t("keySaved") : "";
  $("ebOn").checked = c.enableBanking.configured;
  $("ebAppId").value = c.enableBanking.appId || ""; $("ebPem").value = c.enableBanking.privateKeyPath || "";
  $("ebBox").style.display = $("ebOn").checked ? "" : "none";
  $("ebRedirect").value = c.enableBanking.redirectUrl || "https://enablebanking.com/";
  $("ebCert").value = c.enableBanking.callbackCert || ""; $("ebKey").value = c.enableBanking.callbackKey || "";
  renderSessions(s.ebSessions || []);
  $("otherSources").textContent = t("otherSourcesHint").replace("{s}", c.sources.simplefin).replace("{f}", c.sources.folders);
  $("syncHours").value = c.sync.intervalHours; $("lookback").value = c.sync.lookbackDays;
  $("pricesOn").checked = c.prices.enabled; $("pricesBox").style.display = c.prices.enabled ? "" : "none";
  $("tickersFile").value = c.prices.tickersFile || ""; $("pricesHours").value = c.prices.intervalHours || 24;
  showFingerprint(s.pricesFingerprint || "");

  providers = PROVIDERS.map(n => { const p = (c.prices.providers || []).find(x => x.name === n); return p ? { ...p, on: true } : { name: n, on: n === "yahoo" && (c.prices.providers || []).length === 0, apiKeySet: false, ...DEFAULTS[n] }; });
  renderProviders(); renderProblems(s.problems || []);
}

function renderProblems(list) { $("problems").textContent = list.map(p => p.message).join(" · "); }

function renderProviders() {
  const box = $("providers"); box.textContent = "";
  providers.forEach(p => {
    const item = el("div", { className: "item" });
    const chk = el("input", { type: "checkbox", checked: p.on, onchange: e => { p.on = e.target.checked; renderProviders(); } });
    const head = el("div", { className: "check" }); head.append(chk, el("strong", { textContent: t("prov_" + p.name) }));
    item.append(head);
    if (p.on) {
      const result = el("div", { className: "result" });
      if (p.name !== "yahoo") {
        const key = el("input", { type: "password", autocomplete: "off", placeholder: p.apiKeySet ? t("keySaved") : "", oninput: e => p.apiKey = e.target.value });
        item.append(field(t("key"), key));
      }
      const row = el("div", { className: "row" });
      row.append(field(t("dailyLimit"), el("input", { type: "number", min: 0, value: p.dailyLimit, oninput: e => p.dailyLimit = +e.target.value })),
                 field(t("gap"), el("input", { type: "number", min: 0, value: p.gapSeconds, oninput: e => p.gapSeconds = +e.target.value })));
      item.append(row, el("div", { className: "actions" }, el("button", { textContent: t("test"), onclick: async () => { busy(result); const r = await api("POST", "/api/check/prices", { name: p.name, apiKey: p.apiKey || "" }); show(result, r.data); } })), result);
    }
    box.append(item);
  });
}

function collect() {
  const c = state.config;
  return {
    ratio: { url: $("ratioUrl").value, apiKey: $("ratioKey").value || null, apiKeySet: c.ratio.apiKeySet, pollIntervalSeconds: c.ratio.pollIntervalSeconds },
    enableBanking: { configured: $("ebOn").checked, appId: $("ebAppId").value, privateKeyPath: $("ebPem").value, redirectUrl: $("ebRedirect").value, callbackCert: $("ebCert").value, callbackKey: $("ebKey").value },
    sync: { intervalHours: +$("syncHours").value, lookbackDays: +$("lookback").value },
    prices: {
      enabled: $("pricesOn").checked, tickersFile: $("tickersFile").value, intervalHours: +$("pricesHours").value,
      providers: providers.filter(p => p.on).map(p => ({ name: p.name, apiKey: p.apiKey || null, apiKeySet: p.apiKeySet, dailyLimit: p.dailyLimit, gapSeconds: p.gapSeconds })),
      overrides: c.prices.overrides || []
    }
  };
}

async function load() { const r = await api("GET", "/api/state"); if (r.status === 200) render(r.data); else document.body.textContent = "Open this page from the link printed by “bank-connector ui”."; }
async function svc(action) { busy($("svcResult")); const r = await api("POST", "/api/service/" + action); $("svcResult").className = "result " + (r.status === 200 ? "ok" : "bad"); $("svcResult").textContent = r.status === 200 ? "✓" : (r.data && r.data.error) || "error"; await load(); }

$("ebOn").onchange = () => $("ebBox").style.display = $("ebOn").checked ? "" : "none";
function showFingerprint(fp) { $("fpValue").textContent = fp; $("fpCopy").style.display = fp ? "" : "none"; }
$("fpShow").onclick = async () => {
  const out = $("fpResult"); busy(out);
  const r = await api("POST", "/api/prices/fingerprint");
  const d = r.data || {};
  if (!d.ok) { show(out, { ok: false, message: d.message || "?" }); return; }
  showFingerprint(d.fingerprint);
  const lines = [];
  if (d.created) lines.push(t("fpCreated"));
  if (d.registered) lines.push(t("fpRegistered"));
  else if (d.note === "no-ratio-key") lines.push(t("fpNoKey"));
  else lines.push(t("fpRegisterFailed") + (d.error ? ": " + d.error : ""));
  out.className = "result " + (d.registered ? "ok" : "bad"); out.textContent = (d.registered ? "✓ " : "✗ ") + lines.join("\n");
};
$("pricesRefresh").onclick = async () => {
  const out = $("refreshResult"); busy(out);
  $("pricesRefresh").disabled = true;
  try {
    const d = (await api("POST", "/api/prices/refresh")).data || {};
    if (!d.ok) { show(out, { ok: false, message: d.busy ? t("refreshBusy") : (d.message || "?") }); return; }
    show(out, { ok: true, message: d.tickers === 0 ? t("refreshNone") : t("refreshDone").replace("{n}", d.tickers).replace("{f}", d.failed) });
  } finally { $("pricesRefresh").disabled = false; }
};
$("fpCopy").onclick = async () => { try { await navigator.clipboard.writeText($("fpValue").textContent.replace(/\s+/g, " ").trim()); $("fpResult").className = "result ok"; $("fpResult").textContent = "✓ " + t("fpCopy"); } catch (e) { const r = document.createRange(); r.selectNodeContents($("fpValue")); getSelection().removeAllRanges(); getSelection().addRange(r); } };
$("pricesOn").onchange = () => $("pricesBox").style.display = $("pricesOn").checked ? "" : "none";
$("testRatio").onclick = async () => { busy($("ratioResult")); show($("ratioResult"), (await api("POST", "/api/check/ratio", { url: $("ratioUrl").value, apiKey: $("ratioKey").value })).data); };
$("testEb").onclick = async () => { busy($("ebResult")); show($("ebResult"), (await api("POST", "/api/check/enablebanking", { appId: $("ebAppId").value, pemPath: $("ebPem").value })).data); };
$("save").onclick = async () => {
  const out = $("saveResult"); busy(out);
  const r = await api("PUT", "/api/config", collect());
  if (r.status === 200) { out.className = "result ok"; out.textContent = "✓ " + t("saved"); const s = await api("GET", "/api/state"); if (s.status === 200) render(s.data); }
  else { out.className = "result bad"; out.textContent = (r.data && r.data.problems) ? t("saveBlocked") : ((r.data && r.data.error) || "error"); if (r.data && r.data.problems) renderProblems(r.data.problems); }
};

// ---- Enable Banking: connect and renew a bank without leaving this page
function renderSessions(list) {
  const box = $("ebSessions"); box.textContent = "";
  if (!list.length) { box.append(el("p", { className: "hint", textContent: t("ebNone") })); return; }
  list.forEach(s => {
    const soon = !s.expired && s.daysLeft <= 14;
    const state = s.expired ? ["bad", t("ebExpired")] : soon ? ["warn", t("ebExpiring") + " · " + s.daysLeft + " " + t("ebDays")] : ["ok", s.daysLeft + " " + t("ebDays")];
    const item = el("div", { className: "item" });
    item.append(el("strong", { textContent: s.bank + " (" + s.country + ") " }), el("span", { className: "pill " + state[0], textContent: state[1] }));
    (s.accounts || []).forEach(a => item.append(el("div", { className: "hint", textContent: [a.iban, a.currency, a.name].filter(Boolean).join(" · ") })));
    item.append(el("div", { className: "hint", textContent: t("ebUntil") + " " + new Date(s.validUntil).toLocaleDateString(LANG) }));
    item.append(el("div", { className: "actions" },
      el("button", { className: s.expired || soon ? "primary" : "", textContent: t("ebRenew"), onclick: () => ebStart(s.bank, s.country) }),
      el("button", { className: "danger", textContent: t("ebForget"), onclick: async () => { await api("DELETE", "/api/eb/sessions/" + encodeURIComponent(s.id)); await refreshSessions(); } })));
    box.append(item);
  });
}
async function refreshSessions() { const r = await api("GET", "/api/state"); if (r.status === 200) { state.ebSessions = r.data.ebSessions; renderSessions(r.data.ebSessions || []); } }

let ebPoll = null;
function ebStop() { if (ebPoll) { clearInterval(ebPoll); ebPoll = null; } }

// Saves the form first: the flow reads the credentials and the redirect URL from the saved config.
async function ebSave() {
  const out = $("saveResult"); const r = await api("PUT", "/api/config", collect());
  if (r.status !== 200) { out.className = "result bad"; out.textContent = (r.data && r.data.problems) ? t("saveBlocked") : ((r.data && r.data.error) || "error"); if (r.data && r.data.problems) renderProblems(r.data.problems); return false; }
  return true;
}

function ebPicker() {
  const box = $("ebFlow"); box.style.display = ""; box.textContent = "";
  if (!$("ebAppId").value || !$("ebPem").value || !$("ebRedirect").value) { box.append(el("p", { className: "result bad", textContent: t("ebNeedSetup") })); return; }
  const country = el("select"); ["IT", "DE", "FR", "ES", "NL", "BE", "AT", "PT", "IE", "FI", "PL", "SE"].forEach(c => country.append(el("option", { value: c, textContent: c })));
  const bank = el("input", { type: "text", placeholder: t("ebLoading") }); bank.setAttribute("list", "ebBankList");
  const list = el("datalist", { id: "ebBankList" });
  const result = el("div", { className: "result" });
  const go = el("button", { className: "primary", textContent: t("ebAuthorize"), disabled: true, onclick: () => ebStart(bank.value, country.value) });
  const load = async () => {
    bank.value = ""; go.disabled = true; bank.placeholder = t("ebLoading"); list.textContent = "";
    if (!await ebSave()) return;
    const r = await api("GET", "/api/eb/banks?country=" + country.value);
    if (r.status !== 200) { result.className = "result bad"; result.textContent = (r.data && r.data.error) || "error"; return; }
    result.textContent = ""; bank.placeholder = t("ebBank");
    r.data.banks.forEach(n => list.append(el("option", { value: n })));
    go.disabled = false;
  };
  country.onchange = load;
  const row = el("div", { className: "row" }); row.style.gridTemplateColumns = "110px 1fr"; row.append(field(t("ebCountry"), country), field(t("ebBank"), bank));
  box.append(row, list, el("div", { className: "actions" }, go, el("button", { textContent: t("ebCancel"), onclick: () => { box.style.display = "none"; } })), result);
  load();
}

async function ebStart(bankName, country) {
  const box = $("ebFlow"); box.style.display = ""; box.textContent = ""; ebStop();
  if (!bankName) return;
  if (!await ebSave()) return;
  const r = await api("POST", "/api/eb/start", { bank: bankName, country });
  if (r.status !== 200) { box.append(el("p", { className: "result bad", textContent: (r.data && r.data.error) || "error" })); return; }
  const f = r.data;
  window.open(f.authUrl, "_blank", "noopener");
  box.append(el("strong", { textContent: bankName + " (" + country + ")" }),
    el("p", { className: "hint" }, t("ebOpened"), el("a", { href: f.authUrl, target: "_blank", rel: "noopener", textContent: t("ebOpenLink") }), "."));
  const status = el("div", { className: "result" }); box.append(status);
  const done = sess => {
    ebStop(); box.textContent = "";
    box.append(el("strong", { textContent: "✓ " + t("ebDone") + ": " + sess.bank }));
    (sess.accounts || []).forEach(a => box.append(el("div", { className: "hint", textContent: [a.iban, a.currency, a.name].filter(Boolean).join(" · ") })));
    box.append(el("p", { className: "hint", textContent: t("ebNameHint") }));
    refreshSessions();
  };
  const fail = msg => { ebStop(); status.className = "result bad"; status.textContent = "✗ " + msg; };
  if (f.mode === "auto") {
    status.textContent = t("ebWaitAuto");
    ebPoll = setInterval(async () => {
      const p = await api("GET", "/api/eb/flow/" + f.id);
      if (p.status !== 200) return fail((p.data && p.data.error) || "error");
      if (p.data.status === "done") done(p.data.session); else if (p.data.status === "error") fail(p.data.error);
    }, 1500);
  } else {
    status.textContent = t("ebWaitPaste");
    const paste = el("input", { type: "text" });
    box.append(field(t("ebPaste"), paste), el("div", { className: "actions" }, el("button", { className: "primary", textContent: t("ebFinish"), onclick: async () => {
      busy(status); const p = await api("POST", "/api/eb/flow/" + f.id + "/finish", { pasted: paste.value });
      if (p.status !== 200) return fail((p.data && p.data.error) || "error");
      if (p.data.status === "done") done(p.data.session); else fail(p.data.error);
    } })));
  }
}
$("ebConnect").onclick = ebPicker;
$("ebLocalUrl").onclick = () => { $("ebRedirect").value = "https://enablebanking.com/"; };
load(); setInterval(async () => { if (document.visibilityState !== "visible" || !state) return; const r = await api("GET", "/api/state"); if (r.status === 200) renderHeader(r.data); }, 15000);
</script>
</body>
</html>
